# TEMPORARY, for this PR only: the macOS "Sanity check RADE" step (the
# rade_loss test against a packaged FreeDV) has been failing now and then.
# This builds FreeDV once (release-like, but without PGO or sanitizers) and
# runs that test several times on each kind of macOS runner. The other
# workflows are skipped for this branch meanwhile (see their branches-ignore).
# To be removed before this is merged.

name: Validate macOS TX changes (temporary)

on:
  push:
    branches:
    - 'ms-pipeline-offline-tests'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v6

    - name: Install needed packages
      run: |
        brew install automake libtool numpy sox llvm@20 lld@20 gettext # note: LLVM 21 introduces incompatibilities - see https://github.com/Homebrew/homebrew-core/issues/235411

    - name: Build freedv-gui
      shell: bash
      working-directory: ${{github.workspace}}
      run: |
          BUILD_TYPE=Release UT_ENABLE=1 UNIV_BUILD=0 BUILD_DEPS=1 ENABLE_LTO=1 ./build_osx.sh

    # The new TX/RX thread tests, which need no sound cards.
    - name: Run TxRxThread unit tests
      shell: bash
      working-directory: ${{github.workspace}}/build_osx
      run: |
          FREEDV_TEST_VERBOSE=1 ctest -V -R TxRxThreadTest

    - name: Package executable
      working-directory: ${{github.workspace}}/build_osx
      run: |
          make release

    - name: Stash disk image
      uses: actions/upload-artifact@v7
      with:
        name: FreeDV-validation-dmg
        path: ${{github.workspace}}/build_osx/src/FreeDV.dmg

  rade-loss:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-26]  # ARM64, ARM64, ARM64
        attempt: [1, 2, 3]

    runs-on: ${{ matrix.os }}
    needs: ['build']

    steps:
    - uses: actions/checkout@v6

    - uses: actions/download-artifact@v8
      with:
        name: FreeDV-validation-dmg
        path: ${{github.workspace}}

    - name: Open DMG file
      shell: bash
      working-directory: ${{github.workspace}}
      run: |
          mkdir FreeDV-dmg
          hdiutil attach FreeDV.dmg -mountpoint FreeDV-dmg

    - name: Install needed packages
      run: |
        brew install automake libtool sox

    - uses: ./.github/actions/setup-macos-virtual-audio
      timeout-minutes: 3

    - uses: ./.github/actions/setup-rade-python-env
      with:
        venv-path: rade_venv

    - name: Sanity check RADE
      shell: bash
      run: |
          . ./rade_venv/bin/activate
          FREEDV_COMPUTER_TO_RADIO_DEVICE="BlackHole1 2ch" FREEDV_RADIO_TO_COMPUTER_DEVICE="BlackHole1 2ch" FREEDV_COMPUTER_TO_SPEAKER_DEVICE="VB-Cable" FREEDV_MICROPHONE_TO_COMPUTER_DEVICE="BlackHole2 2ch" FREEDV_BINARY=./FreeDV-dmg/FreeDV.app/Contents/MacOS/FreeDV ./test/test_rade_loss.sh 2>&1 | tee temp-test.txt
          echo "----- Summary -----"
          grep -E "Sync changed|Sound card FIFOs|loss:|PASS|FAIL|second decode|RECORDING CHECK|missing|extra|silence|plot taps" temp-test.txt rx2.log 2>/dev/null || true
          if grep -q "most likely the machine stalled" recording_check.txt 2>/dev/null; then
              echo "::warning::rade_loss: $(grep "RECORDING CHECK" recording_check.txt)"
          fi
          grep "PASS" temp-test.txt

    - name: Keep what the test left behind
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: rade-loss-${{ matrix.os }}-${{ matrix.attempt }}
        path: |
          ${{github.workspace}}/test.wav
          ${{github.workspace}}/txfeatures.f32
          ${{github.workspace}}/rxfeatures.f32
          ${{github.workspace}}/rxfeatures2.f32
          ${{github.workspace}}/tx.log
          ${{github.workspace}}/rx.log
          ${{github.workspace}}/rx2.log
          ${{github.workspace}}/loss.txt
          ${{github.workspace}}/temp-test.txt
          ${{github.workspace}}/txout.wav
          ${{github.workspace}}/recording_check.txt
        if-no-files-found: ignore
