name: Build FreeDV (macOS)

# Trimmed for an audio device experiment on this branch: does the device layout that #1516
# switched macOS CI to (radio on BlackHole1, speaker on VB-Cable) make rade_loss fail more
# often than the previous one (radio on VB-Cable, speaker on BlackHole1)? Each job builds
# FreeDV once, then alternates rade_loss runs of the two layouts on the same runner.
# Everything else (lint, sanitizers, PGO, packaging, app folder tests) is left out.

on:
  push:
    branches-ignore:
    - 'dr-render-manual'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # rade_loss runs per layout per job.
  ROUNDS: 6

jobs:
  rade-loss-devices:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]  # ARM64
        instance: [1, 2]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    steps:
    - uses: actions/checkout@v6

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        # Same key as master's WITH_ASAN=0 test job, which builds the same way.
        key: test-macos-26-WITH_ASAN=0
        create-symlink: true
        max-size: "5G"

    - name: Install needed packages
      run: |
        brew install automake libtool numpy sox wxwidgets speexdsp portaudio libsndfile hamlib libebur128

    - uses: ./.github/actions/setup-macos-virtual-audio
      timeout-minutes: 3

    - name: Build freedv-gui
      shell: bash
      working-directory: ${{github.workspace}}
      run: BUILD_TYPE=RelWithDebInfo UT_ENABLE=1 UNIV_BUILD=0 BUILD_DEPS=0 WITH_ASAN=0 ./build_osx.sh

    - uses: ./.github/actions/setup-rade-python-env
      with:
        venv-path: rade_venv
        working-directory: ${{github.workspace}}/build_osx

    - name: Run rade_loss, alternating device layouts
      shell: bash
      working-directory: ${{github.workspace}}/build_osx
      run: |
        . ./rade_venv/bin/activate
        mkdir -p $RUNNER_TEMP/runs
        run_layout() {
          local layout=$1 round=$2 order=$3
          local out=$RUNNER_TEMP/runs/${layout}_${round}
          if [ "$layout" == "current" ]; then
            # Since #1516: radio on BlackHole1, speaker on VB-Cable.
            radio="BlackHole1 2ch"; speaker="VB-Cable"
          else
            # Before #1516: radio on VB-Cable, speaker on BlackHole1.
            radio="VB-Cable"; speaker="BlackHole1 2ch"
          fi
          echo "::group::round $round: $layout"
          PYTHONPATH=$(pwd)/rade_src \
            FREEDV_COMPUTER_TO_RADIO_DEVICE="$radio" FREEDV_RADIO_TO_COMPUTER_DEVICE="$radio" \
            FREEDV_COMPUTER_TO_SPEAKER_DEVICE="$speaker" FREEDV_MICROPHONE_TO_COMPUTER_DEVICE="BlackHole2 2ch" \
            ../test/test_rade_loss.sh > $out.log 2>&1 || true
          loss=$(grep -oE "loss: [0-9.]+" $out.log | awk '{print $2}' | tail -1)
          result=$(grep -oE "^(PASS|FAIL)" $out.log | tail -1)
          echo "$round,$order,$layout,${loss:-none},${result:-none}" | tee -a $RUNNER_TEMP/runs/results.csv
          echo "::endgroup::"
        }
        echo "round,order,layout,loss,result" > $RUNNER_TEMP/runs/results.csv
        for round in $(seq 1 $ROUNDS); do
          # Alternate which layout goes first, so neither always runs on a "fresh" system.
          if [ $((round % 2)) -eq 1 ]; then
            run_layout current $round 1; run_layout previous $round 2
          else
            run_layout previous $round 1; run_layout current $round 2
          fi
        done

    - name: Summarize
      shell: bash
      if: ${{ !cancelled() }}
      run: |
        f=$RUNNER_TEMP/runs/results.csv
        {
          echo "### ${{ matrix.os }} #${{ matrix.instance }}"
          echo
          echo "| layout | runs | passes | failures | losses |"
          echo "|---|---|---|---|---|"
          for layout in current previous; do
            runs=$(grep -c ",$layout," $f)
            passes=$(grep ",$layout," $f | grep -c ",PASS$")
            losses=$(grep ",$layout," $f | cut -d, -f4 | tr '\n' ' ')
            echo "| $layout | $runs | $passes | $((runs - passes)) | $losses |"
          done
          echo
          echo '```'
          cat $f
          echo '```'
        } | tee -a $GITHUB_STEP_SUMMARY

    - name: Stash results
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: rade-loss-${{ matrix.os }}-${{ matrix.instance }}
        path: ${{ runner.temp }}/runs
        retention-days: 7
