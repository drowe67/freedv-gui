name: Build FreeDV (macOS)

# Trimmed for a rade_loss diagnostic on this branch: catch the occasional rade_loss failure
# of the regular (uninstrumented) build, in which RX loses sync partway through, with
# enough data to tell where the audio was disrupted.
#
# Each job builds FreeDV once, then runs rade_loss ROUNDS times. Each run keeps the captured
# TX audio (test.wav) and FreeDV's own TX output (tx_out.wav), and is scored for silence
# inside the captured transmission and for whether the capture is longer than FreeDV's
# output (silence inserted on the way out) or shorter (samples lost on the way in).
# Everything else (lint, sanitizers, PGO, packaging) is left out.
#
# With RECORD_THREAD_STATE=1, the first 100 s of each round (covering the TX transmission,
# where the capture gaps occur) is also recorded with Instruments' Thread Activity and System Load instruments (the thread
# state part of System Trace) across all processes, to see whether threads were runnable but
# not running during the stalls. Traces are large (~1.4 GB per round, barely compressible) and
# the runners have ~20 GB free, so they're kept only for failed rounds.

on:
  push:
    branches-ignore:
    - 'dr-render-manual'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  ROUNDS: 8
  # Seconds a round's test_rade_loss.sh may run before it's treated as hung.
  ROUND_TIMEOUT: 720
  # Thread-state recording (xctrace) is off: its traces already showed the stalls' cause, and
  # it was what hung in the earlier runs.
  RECORD_THREAD_STATE: 0

jobs:
  rade-loss-diag:
    strategy:
      fail-fast: false
      matrix:
        # The same macOS versions as the test-app-folder jobs (where the latest regular-build
        # failure was, on macOS 14) plus the test job's.
        # Only macOS 26 for now.
        os: [macos-26]  # ARM64
        instance: [1, 2, 3, 4, 5, 6]
        sanitizer: [WITH_ASAN=0]
        # freedv-backend's TapStep as-is (a Utility-QoS thread per tap), as on master. "inline"
        # applies cmake/freedv-backend-inline-tap.patch (tapped step run on the pipeline thread);
        # the last run's A/B showed fewer context switches and no change in rade_loss failures.
        tap: [threaded]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    env:
      # Read by build_macos_sound_drivers.sh (via setup-macos-virtual-audio).
      BLACKHOLE_LATENCY_FRAMES: 0
      # Read by cmake/BuildFreeDVBackend.cmake: patch applied to freedv-backend, if any.
      FREEDV_BACKEND_PATCH: ${{ matrix.tap == 'inline' && format('{0}/cmake/freedv-backend-inline-tap.patch', github.workspace) || '' }}

    steps:
    - uses: actions/checkout@v6

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        # Same key as master's test job for this sanitizer, which builds the same way.
        key: test-${{ matrix.os }}-${{ matrix.sanitizer }}
        create-symlink: true
        max-size: "5G"

    - name: Install needed packages
      run: |
        brew install automake libtool numpy sox wxwidgets speexdsp portaudio libsndfile hamlib libebur128

    - uses: ./.github/actions/setup-macos-virtual-audio
      timeout-minutes: 5

    - name: Show BlackHole device latency
      shell: bash
      run: swift ${{github.workspace}}/test/diag/device_latency.swift BlackHole

    - name: Set up Instruments
      if: ${{ env.RECORD_THREAD_STATE == '1' }}
      shell: bash
      continue-on-error: true
      run: |
        sudo DevToolsSecurity -enable || true
        xcrun xctrace version
        # Smoke test, so a problem recording shows up here rather than silently in every round.
        df -h $RUNNER_TEMP | tail -1
        # The thread state instrument is "Thread Activity" in newer Xcode and "Thread State
        # Trace" in older ones (the runners have xctrace 15.3-16.0); fall back to the whole
        # System Trace template if neither exists.
        xcrun xctrace list instruments > $RUNNER_TEMP/instruments.txt
        grep -iE "thread|system|load|context|sched" $RUNNER_TEMP/instruments.txt || true
        args=()
        ts=$(grep -m1 -xE "Thread Activity|Thread State Trace" $RUNNER_TEMP/instruments.txt || true)
        if [ -n "$ts" ]; then
          args+=(--instrument "$ts")
          grep -qx "System Load" $RUNNER_TEMP/instruments.txt && args+=(--instrument "System Load")
        else
          args+=(--template "System Trace")
        fi
        printf '%s\n' "${args[@]}" > $RUNNER_TEMP/xctrace_args.txt
        echo "recording with: ${args[*]}"
        sudo xcrun xctrace record "${args[@]}" --all-processes \
          --time-limit 3s --output $RUNNER_TEMP/smoke.trace 2>&1 | tail -3
        sudo du -sh $RUNNER_TEMP/smoke.trace || true
        sudo rm -rf $RUNNER_TEMP/smoke.trace

    - name: Build audioprobe
      shell: bash
      run: |
        clang -O2 -Wall -Wextra -o $RUNNER_TEMP/audioprobe ${{github.workspace}}/test/diag/audioprobe.c -framework CoreAudio -framework CoreFoundation

    - name: Build freedv-gui
      shell: bash
      working-directory: ${{github.workspace}}
      run: BUILD_TYPE=RelWithDebInfo UT_ENABLE=1 UNIV_BUILD=0 BUILD_DEPS=0 ${{matrix.sanitizer}} ./build_osx.sh

    - uses: ./.github/actions/setup-rade-python-env
      with:
        venv-path: rade_venv
        working-directory: ${{github.workspace}}/build_osx

    - name: Run rade_loss
      shell: bash
      working-directory: ${{github.workspace}}/build_osx
      run: |
        . ./rade_venv/bin/activate
        mkdir -p $RUNNER_TEMP/runs
        echo "round,loss,result,zeroed,gaps_per_s,gap_lengths,capture_minus_txout_samples,gaps_in_capture,tx_fifo_empty,sync_changes,timing_events,audioprobe_events,tx_cpu_s,tx_vol_csw,tx_invol_csw,rx_cpu_s,rx_vol_csw,rx_invol_csw,rl_bh1_jumps,rl_bh1_max_frames,fd_result,fd_sync_changes,fd_bh1_jumps,fd_bh1_max_frames" > $RUNNER_TEMP/runs/results.csv
        # FreeDV runs under /usr/bin/time -l, which appends each run's resource usage (CPU
        # time, voluntary and involuntary context switches, summed over all its threads) to
        # $FREEDV_TIME_LOG: the TX run's, then the RX run's.
        cat > $RUNNER_TEMP/freedv_timed.sh <<EOF
        #!/bin/bash
        exec /usr/bin/time -l -a -o "\$FREEDV_TIME_LOG" $(pwd)/src/FreeDV.app/Contents/MacOS/FreeDV "\$@"
        EOF
        chmod +x $RUNNER_TEMP/freedv_timed.sh
        # rusage of the Nth FreeDV run in a time log: "cpu_s,voluntary,involuntary".
        freedv_usage() {
          awk -v n=$2 '
            / real .* user .* sys/ { run++; if (run == n) cpu = $3 + $5 }
            /voluntary context switches/ && run == n { if ($2 == "voluntary") vol = $1; else invol = $1 }
            END { if (cpu == "") print "none,none,none"; else printf "%.2f,%s,%s\n", cpu, vol, invol }' $1 2>/dev/null || echo "none,none,none"
        }
        for round in $(seq 1 $ROUNDS); do
          out=$RUNNER_TEMP/runs/run_$round
          mkdir -p $out
          echo "::group::round $round"
          # A separate CoreAudio client on an otherwise unused output, logging its own
          # stalled cycles: tells coreaudiod-wide stalls from ones inside FreeDV's process.
          $RUNNER_TEMP/audioprobe "BlackHole2 2ch 2" > $out/audioprobe.log 2>&1 &
          probe_pid=$!
          # What else the machine was doing: powermetrics every 250 ms, and afterwards
          # coreaudiod's log for the round. (The per-process ps sampler is turned off: on these
          # 3-core runners its ps calls averaged a third of a core, more than FreeDV itself.)
          round_start=$(date "+%Y-%m-%d %H:%M:%S")
          sudo powermetrics -i 250 --samplers tasks,cpu_power --show-process-wait-times --show-process-qos -o $out/powermetrics.txt > $out/powermetrics.err 2>&1 &
          sleep 2
          if ! pgrep -x powermetrics > /dev/null; then
            echo "powermetrics with cpu_power didn't start ($(head -c 300 $out/powermetrics.err)); retrying with tasks only"
            sudo powermetrics -i 250 --samplers tasks --show-process-wait-times --show-process-qos -o $out/powermetrics.txt > $out/powermetrics.err 2>&1 &
          fi
          # Thread states across all processes for the first 100 s of the round. clock_ref.txt
          # maps wall clock time (the trace's start date) to host time (TIMINGDIAG lines).
          python3 -c 'import time; print(f"wall {time.time():.6f} host {time.clock_gettime(time.CLOCK_UPTIME_RAW):.6f}")' > $out/clock_ref.txt
          xctrace_pid=
          free_gb=$(df -g $RUNNER_TEMP | tail -1 | awk '{print $4}')
          if [ ! -s $RUNNER_TEMP/xctrace_args.txt ]; then
            if [ "$RECORD_THREAD_STATE" = "1" ]; then echo "Instruments setup failed, not recording this round"; fi
          elif [ "$free_gb" -ge 5 ]; then
            # (bash 3.2 compatible: no mapfile)
            args=()
            while IFS= read -r line; do args+=("$line"); done < $RUNNER_TEMP/xctrace_args.txt
            sudo xcrun xctrace record "${args[@]}" --all-processes \
              --time-limit 100s --output $out/profile.trace > $out/xctrace.log 2>&1 &
            xctrace_pid=$!
            sleep 3
          else
            echo "only ${free_gb} GB free, not recording this round"
          fi
          # Same devices and sanitizer options as master's test job.
          RADE_LOSS_SAVE_DIR=$out PYTHONPATH=$(pwd)/rade_src \
            TSAN_OPTIONS=halt_on_error=1:ignore_noninstrumented_modules=1 \
            FREEDV_COMPUTER_TO_RADIO_DEVICE="BlackHole1 2ch" FREEDV_RADIO_TO_COMPUTER_DEVICE="BlackHole1 2ch" \
            FREEDV_COMPUTER_TO_SPEAKER_DEVICE="VB-Cable" FREEDV_MICROPHONE_TO_COMPUTER_DEVICE="BlackHole2 2ch" \
            FREEDV_BINARY=$RUNNER_TEMP/freedv_timed.sh FREEDV_TIME_LOG=$out/freedv_time.txt \
            ../test/test_rade_loss.sh > $out/run.log 2>&1 &
          test_pid=$!
          # Watchdog: every wait in the round is bounded. If the test (normally ~3 minutes), the
          # audio probe's shutdown or the profiler's save doesn't finish in time, capture what
          # everything is doing and fail the job right away, rather than hanging until the job
          # timeout with nothing to show. (Liveness is checked with ps, not kill -0, which fails
          # on the root-owned sudo xctrace.)
          bounded_wait() {  # pid seconds -> 0 if it exited in time
            local w=0
            while ps -p $1 > /dev/null 2>&1 && [ $w -lt $2 ]; do sleep 2; w=$((w + 2)); done
            ! ps -p $1 > /dev/null 2>&1
          }
          capture_hang() {  # what, seconds, extra pids to sample
            local what=$1 secs=$2; shift 2
            echo "::error::round $round: $what still running after $secs s, capturing state and failing"
            ps -axww -o pid,ppid,stat,etime,time,%cpu,command > $out/hang_ps.txt
            # The test script's process tree (FreeDV, tee, sox, python), if it's still there.
            local tree= frontier= next= p name
            if ps -p $test_pid > /dev/null 2>&1; then tree=$test_pid; frontier=$test_pid; fi
            while [ -n "$frontier" ]; do
              next=
              for p in $frontier; do next="$next $(pgrep -P $p | tr '\n' ' ')"; done
              frontier=$(echo $next); tree="$tree $frontier"
            done
            echo "test process tree: ${tree:-gone}"
            for p in $tree "$@" $(pgrep -x audioprobe) $(pgrep -x coreaudiod) $(pgrep -f "xctrace record"); do
              name=$(ps -o comm= -p $p 2>/dev/null | xargs basename 2>/dev/null)
              [ -n "$name" ] || continue
              [ -f $out/hang_sample_${name}_${p}.txt ] && continue
              echo "sampling $p ($name)"
              sudo sample $p 5 -mayDie -file $out/hang_sample_${name}_${p}.txt > /dev/null 2>&1 || true
            done
            sudo spindump -notarget 5 -file $out/hang_spindump.txt > /dev/null 2>&1 || true
            /usr/bin/log show --last 20m --style compact \
              --predicate 'process == "coreaudiod" OR process == "FreeDV" OR process == "sox" OR process == "audioprobe" OR subsystem BEGINSWITH "com.apple.coreaudio" OR subsystem BEGINSWITH "com.apple.audio"' \
              > $out/hang_log.txt 2>&1 &
            bounded_wait $! 120 || sudo pkill -9 -f "log show --last 20m" || true
            swift ${{github.workspace}}/test/diag/device_latency.swift > $out/hang_devices.txt 2>&1 &
            bounded_wait $! 60 || true
            cp tmp.log $out/hang_tmp.log 2>/dev/null || true
            echo "--- run.log (last 60 lines)"; tail -60 $out/run.log
            echo "--- xctrace.log"; cat $out/xctrace.log 2>/dev/null || true
            echo "--- audioprobe.log (last 5 lines)"; tail -5 $out/audioprobe.log
            echo "--- relevant processes"
            grep -E "FreeDV|sox|python|tee|audioprobe|xctrace|coreaudiod|test_rade_loss|powermetrics" $out/hang_ps.txt | grep -v grep || true
            sudo pkill -INT -x powermetrics || true
            echo "$round,TIMEOUT: $what" >> $RUNNER_TEMP/runs/results.csv
            echo "::endgroup::"
            exit 1
          }
          bounded_wait $test_pid $ROUND_TIMEOUT || capture_hang "test_rade_loss.sh" $ROUND_TIMEOUT
          wait $test_pid || true
          # Then master's fullduplex_RADEV1 test (one FreeDV, HalfDuplex=0, transmitting the mic
          # tone into BlackHole1 and decoding it from BlackHole1 for ~130 s; passes if RADE's
          # sync changes exactly once), to see whether it gets the same BlackHole1 skips and
          # whether its sync survives them.
          FREEDV_COMPUTER_TO_RADIO_DEVICE="BlackHole1 2ch" FREEDV_RADIO_TO_COMPUTER_DEVICE="BlackHole1 2ch" \
            FREEDV_COMPUTER_TO_SPEAKER_DEVICE="VB-Cable" FREEDV_MICROPHONE_TO_COMPUTER_DEVICE="BlackHole2 2ch" \
            FREEDV_BINARY=$RUNNER_TEMP/freedv_timed.sh FREEDV_TIME_LOG=$out/fd_time.txt \
            ../test/test_zeros.sh txrx RADEV1 > $out/fullduplex.log 2>&1 &
          test_pid=$!
          bounded_wait $test_pid $ROUND_TIMEOUT || capture_hang "test_zeros.sh txrx RADEV1" $ROUND_TIMEOUT
          wait $test_pid || true
          kill -TERM $probe_pid 2>/dev/null || true
          bounded_wait $probe_pid 30 || capture_hang "audioprobe (after SIGTERM)" 30 $probe_pid
          wait $probe_pid 2>/dev/null || true
          sudo pkill -INT -x powermetrics || true
          # Stop the profiler; it takes a while to write the trace.
          if [ -n "$xctrace_pid" ]; then
            sudo pkill -INT -f "xctrace record" || true
            bounded_wait $xctrace_pid 600 || capture_hang "xctrace (saving the trace)" 600
            wait $xctrace_pid 2>/dev/null || true
            tail -2 $out/xctrace.log || true
          fi
          sleep 1
          round_end=$(date "+%Y-%m-%d %H:%M:%S")
          /usr/bin/log show --start "$round_start" --end "$round_end" \
            --predicate 'process == "coreaudiod" OR subsystem BEGINSWITH "com.apple.coreaudio" OR subsystem BEGINSWITH "com.apple.audio"' \
            --style compact > $out/coreaudiod.log 2>&1 &
          bounded_wait $! 180 || { echo "log show took over 180 s, skipped"; kill $! 2>/dev/null; }
          sudo chown $(id -u) $out/powermetrics.txt 2>/dev/null || true
          gzip -f $out/powermetrics.txt 2>/dev/null || true
          echo "coreaudiod.log $(wc -l < $out/coreaudiod.log) lines, powermetrics $(ls -la $out/powermetrics.txt* 2>/dev/null | awk '{print $5}') bytes"
          probe_events=$(grep -c "jumped" $out/audioprobe.log || true)
          grep -E "started|jumped|not found|could not" $out/audioprobe.log | head -20 || true
          loss=$(grep -oE "loss: [0-9.]+" $out/run.log | awk '{print $2}' | tail -1 || true)
          result=$(grep -oE "^(PASS|FAIL)" $out/run.log | tail -1 || true)
          fifo_empty=$(grep -oE "fifo_empty = [0-9]+" $out/run.log | awk '{print $3}' | tail -1 || true)
          syncs=$(grep -c "Sync changed" $out/run.log || true)
          # Irregular output callback cycles and overloads logged by the instrumented
          # MacAudioDevice (radio output is BlackHole1 2ch).
          timing=$(grep -cE "TIMINGDIAG .*(jumped|overload)" $out/run.log || true)
          # BlackHole1 (radio) callback skips, in frames: count and largest, per test.
          bh1_jumps() {
            grep -oE 'TIMINGDIAG "BlackHole1 2ch": at [0-9.]+ s: sample time jumped \+[0-9]+' $1 2>/dev/null \
              | grep -oE '[0-9]+$' | sort -n | awk '{n++; m=$1} END {printf "%d,%d", n, m}' || true
          }
          rl_bh1=$(bh1_jumps $out/run.log)
          fd_bh1=$(bh1_jumps $out/fullduplex.log)
          fd_syncs=$(grep -oE "Got [0-9]+ sync changes" $out/fullduplex.log | awk '{print $2}' | tail -1 || true)
          if [ "$fd_syncs" = "1" ]; then fd_result=PASS; else fd_result=FAIL; fi
          echo "fullduplex: $fd_result, ${fd_syncs:-no} sync changes, BlackHole1 jumps/largest $fd_bh1; rade_loss BlackHole1 jumps/largest $rl_bh1"
          # ...and, to tell a process- or machine-wide pause from a stall of only the audio
          # threads, the probe thread's and GUI timer's overruns (all with host times).
          # (The probe thread's overruns are left out here: on CI runners its 10 ms sleeps
          # routinely take ~85 ms, so they'd flood this log. They're in run.log.)
          grep -E "TIMINGDIAG .*(jumped|overload|GUI timer|processing took)" $out/run.log | sed 's#^.*TIMINGDIAG#TIMINGDIAG#' | head -40 || true
          zeroed=none; gps=none; gaps=none; diff=none; capgaps=none
          if [ -f $out/test.wav ]; then
            sox $out/test.wav -t raw -e signed -b 16 -c 1 -r 48000 $RUNNER_TEMP/capture.raw
            z=$(python3 ${{github.workspace}}/test/diag/zerofrac.py $RUNNER_TEMP/capture.raw "round $round")
            echo "$z"
            zeroed=$(echo "$z" | grep -oE "[0-9.]+% of" | awk '{print $1}' || true)
            gps=$(echo "$z" | grep -oE "gaps per second [0-9.]+" | awk '{print $4}' || true)
            gaps=$(echo "$z" | sed -E 's/.*\(samples:count\) ?//' | tr ',' ' ' | xargs)
            if [ -f $out/tx_out.wav ]; then
              sox $out/tx_out.wav -t raw -e signed -b 16 -c 1 -r 48000 $RUNNER_TEMP/txout.raw
              g=$(python3 ${{github.workspace}}/test/diag/gaps_vs_ref.py $RUNNER_TEMP/capture.raw $RUNNER_TEMP/txout.raw "round $round")
              echo "$g"
              diff=$(echo "$g" | grep -oE "difference [+-]?[0-9]+" | awk '{print $2}' || true)
              capgaps=$(echo "$g" | sed -E 's/.*samples: ?//' | tr ',' ' ' | xargs)
            fi
          fi
          tail -5 $out/run.log
          echo "$round,${loss:-none},${result:-none},${zeroed},${gps},${gaps:-none},${diff},${capgaps:-none},${fifo_empty:-none},${syncs},${timing},${probe_events},$(freedv_usage $out/freedv_time.txt 1),$(freedv_usage $out/freedv_time.txt 2),${rl_bh1},${fd_result},${fd_syncs:-none},${fd_bh1}" | tee -a $RUNNER_TEMP/runs/results.csv
          # Keep the trace only for failed rounds.
          if [ -d $out/profile.trace ]; then
            sudo chown -R $(id -u) $out/profile.trace
            echo "trace: $(du -sh $out/profile.trace | awk '{print $1}'), $(df -h $RUNNER_TEMP | tail -1 | awk '{print $4}') free"
            if [ "${result:-none}" != "PASS" ]; then
              tar czf $out/profile.trace.tgz -C $out profile.trace
              echo "kept profile: $(ls -la $out/profile.trace.tgz | awk '{print $5}') bytes"
            fi
            rm -rf $out/profile.trace
          fi
          echo "::endgroup::"
        done

    - name: Summarize
      shell: bash
      if: ${{ !cancelled() }}
      run: |
        {
          echo "### ${{ matrix.os }} #${{ matrix.instance }} (TapStep ${{ matrix.tap }})"
          echo
          echo '```'
          cat $RUNNER_TEMP/runs/results.csv
          echo '```'
        } | tee -a $GITHUB_STEP_SUMMARY

    - name: Stash results
      uses: actions/upload-artifact@v7
      # Also after a hang (the run step fails) or a cancellation.
      if: ${{ always() }}
      with:
        name: rade-loss-diag-${{ matrix.os }}-${{ matrix.instance }}-tap-${{ matrix.tap }}
        path: ${{ runner.temp }}/runs
        retention-days: 7
