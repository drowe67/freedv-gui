name: Build FreeDV (macOS)

# Trimmed for the PlotScalar performance experiment on this branch: one job that builds
# FreeDV with and without the PlotScalar change, then alternates rade_loss runs of the two
# on the same runner with the Time Profiler attached to each TX phase. Everything else
# (lint, sanitizers, PGO, packaging, app folder tests) is left out.

on:
  push:
    branches-ignore:
    - 'dr-render-manual'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # Number of base/patched rade_loss run pairs.
  ROUNDS: 3

jobs:
  plotscalar-perf:
    runs-on: macos-26  # ARM64
    timeout-minutes: 120

    steps:
    - uses: actions/checkout@v6

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        # Same key as master's WITH_ASAN=0 test job, which builds the same way, so this
        # starts from its cache.
        key: test-macos-26-WITH_ASAN=0
        create-symlink: true
        max-size: "5G"

    - name: Install needed packages
      run: |
        brew install automake libtool numpy sox wxwidgets speexdsp portaudio libsndfile hamlib libebur128

    - uses: ./.github/actions/setup-macos-virtual-audio
      timeout-minutes: 3

    - name: Show displays
      run: |
        swift test/perf/screens.swift
        system_profiler SPDisplaysDataType

    - name: Build freedv-gui (patched)
      shell: bash
      working-directory: ${{github.workspace}}
      run: |
        BUILD_TYPE=RelWithDebInfo UT_ENABLE=1 UNIV_BUILD=0 BUILD_DEPS=0 WITH_ASAN=0 ./build_osx.sh
        mkdir -p $RUNNER_TEMP/apps
        cp -R build_osx/src/FreeDV.app $RUNNER_TEMP/apps/patched.app

    - name: Build freedv-gui (base)
      shell: bash
      working-directory: ${{github.workspace}}
      run: |
        # Same build with master's PlotScalar; only that file recompiles.
        git fetch --no-tags --depth=1 origin master
        git checkout FETCH_HEAD -- src/gui/controls/plot_scalar.cpp
        git diff --stat HEAD
        cd build_osx
        make -j$(sysctl -n hw.logicalcpu) FreeDV
        cp -R src/FreeDV.app $RUNNER_TEMP/apps/base.app

    - uses: ./.github/actions/setup-rade-python-env
      with:
        venv-path: rade_venv
        working-directory: ${{github.workspace}}/build_osx

    - name: Profile rade_loss (base and patched, alternating)
      shell: bash
      working-directory: ${{github.workspace}}/build_osx
      run: |
        . ./rade_venv/bin/activate
        mkdir -p $RUNNER_TEMP/perf
        for round in $(seq 1 $ROUNDS); do
          for variant in base patched; do
            out=$RUNNER_TEMP/perf/$variant$round
            mkdir -p $out
            echo "::group::$variant round $round"
            PYTHONPATH=$(pwd)/rade_src \
              REAL_FREEDV_BINARY=$RUNNER_TEMP/apps/$variant.app/Contents/MacOS/FreeDV \
              PROFILE_OUT_DIR=$out \
              FREEDV_BINARY=${{github.workspace}}/test/perf/freedv_profiled.sh \
              FREEDV_COMPUTER_TO_RADIO_DEVICE="BlackHole1 2ch" FREEDV_RADIO_TO_COMPUTER_DEVICE="BlackHole1 2ch" \
              FREEDV_COMPUTER_TO_SPEAKER_DEVICE="VB-Cable" FREEDV_MICROPHONE_TO_COMPUTER_DEVICE="BlackHole2 2ch" \
              ../test/test_rade_loss.sh > $out/run.log 2>&1 || true
            grep -E "loss:|^PASS|^FAIL" $out/run.log || echo "no loss result"
            echo "::endgroup::"
          done
        done

    - name: Summarize profiles
      shell: bash
      if: ${{ !cancelled() }}
      run: |
        {
          echo "| run | loss | result | TX main thread ms | CA commit ms | backing store update ms | color convert ms | draw image ms | scaled blit ms | PlotScalar::draw ms | txThread ms | rxThread ms |"
          echo "|---|---|---|---|---|---|---|---|---|---|---|---|"
          for out in $RUNNER_TEMP/perf/*; do
            run=$(basename $out)
            loss=$(grep -oE "loss: [0-9.]+" $out/run.log | awk '{print $2}')
            result=$(grep -oE "^(PASS|FAIL)" $out/run.log | head -1)
            if [ -d $out/freedv_tx.trace ]; then
              xctrace export --input $out/freedv_tx.trace \
                --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' \
                --output $out/tx.xml > /dev/null 2>&1
              python3 test/perf/summarize_trace.py $out/tx.xml > $out/tx.json
              python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('| $run | ${loss:--} | ${result:--} | ' + ' | '.join(str(d[k]) for k in ['main_thread_ms','ca_commit_ms','backing_store_update_ms','color_convert_ms','draw_image_ms','scaled_blit_ms','plot_scalar_draw_ms','tx_thread_ms','rx_thread_ms']) + ' |')" $out/tx.json
            else
              echo "| $run | ${loss:--} | ${result:--} | no trace | | | | | | | | |"
            fi
          done
        } | tee -a $GITHUB_STEP_SUMMARY

    - name: Stash traces
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: plotscalar-perf-traces
        path: |
          ${{ runner.temp }}/perf/*/freedv_tx.trace
          ${{ runner.temp }}/perf/*/tx.json
          ${{ runner.temp }}/perf/*/run.log
        retention-days: 7
