name: Build FreeDV (macOS)

# Trimmed for a rade_loss diagnostic on this branch. Locally, rade_loss failures came from
# BlackHole returning silence for part of every device buffer: its input read zeroes the
# buffer (and clears its ring) when a client reads past the last block written. Does that
# happen in CI too, and does giving the BlackHole drivers a nonzero latency (which
# build_macos_sound_drivers.sh meant to set to 128 but never did) stop it?
#
# Each job builds FreeDV once (plain or TSAN, which fails rade_loss every time in CI), with
# the BlackHole drivers built for the given latency, then runs rade_loss ROUNDS times. Each
# run keeps the captured TX audio (test.wav) and FreeDV's own TX output (tx_out.wav), and is
# scored for how much of the captured transmission is missing.
# Everything else (lint, other sanitizers, PGO, packaging) is left out.

on:
  push:
    branches-ignore:
    - 'dr-render-manual'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  ROUNDS: 5

jobs:
  rade-loss-diag:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]  # ARM64
        sanitizer: [WITH_ASAN=0, WITH_TSAN=1]
        blackhole_latency: [0, 128]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 150

    env:
      # Read by build_macos_sound_drivers.sh (via setup-macos-virtual-audio).
      BLACKHOLE_LATENCY_FRAMES: ${{ matrix.blackhole_latency }}

    steps:
    - uses: actions/checkout@v6

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.23
      with:
        # Same key as master's test job for this sanitizer, which builds the same way.
        key: test-${{ matrix.os }}-${{ matrix.sanitizer }}
        create-symlink: true
        max-size: "5G"

    - name: Install needed packages
      run: |
        brew install automake libtool numpy sox wxwidgets speexdsp portaudio libsndfile hamlib libebur128

    - uses: ./.github/actions/setup-macos-virtual-audio
      timeout-minutes: 5

    - name: Show BlackHole device latency
      shell: bash
      run: swift ${{github.workspace}}/test/diag/device_latency.swift BlackHole

    - name: Build freedv-gui
      shell: bash
      working-directory: ${{github.workspace}}
      run: BUILD_TYPE=RelWithDebInfo UT_ENABLE=1 UNIV_BUILD=0 BUILD_DEPS=0 ${{matrix.sanitizer}} ./build_osx.sh

    - uses: ./.github/actions/setup-rade-python-env
      with:
        venv-path: rade_venv
        working-directory: ${{github.workspace}}/build_osx

    - name: Run rade_loss
      shell: bash
      working-directory: ${{github.workspace}}/build_osx
      run: |
        . ./rade_venv/bin/activate
        mkdir -p $RUNNER_TEMP/runs
        echo "round,loss,result,zeroed,gaps_per_s,gap_lengths,tx_fifo_empty,sync_changes" > $RUNNER_TEMP/runs/results.csv
        for round in $(seq 1 $ROUNDS); do
          out=$RUNNER_TEMP/runs/run_$round
          mkdir -p $out
          echo "::group::round $round"
          # Same devices and sanitizer options as master's test job.
          RADE_LOSS_SAVE_DIR=$out PYTHONPATH=$(pwd)/rade_src \
            TSAN_OPTIONS=halt_on_error=1:ignore_noninstrumented_modules=1 \
            FREEDV_COMPUTER_TO_RADIO_DEVICE="BlackHole1 2ch" FREEDV_RADIO_TO_COMPUTER_DEVICE="BlackHole1 2ch" \
            FREEDV_COMPUTER_TO_SPEAKER_DEVICE="VB-Cable" FREEDV_MICROPHONE_TO_COMPUTER_DEVICE="BlackHole2 2ch" \
            ../test/test_rade_loss.sh > $out/run.log 2>&1 || true
          loss=$(grep -oE "loss: [0-9.]+" $out/run.log | awk '{print $2}' | tail -1)
          result=$(grep -oE "^(PASS|FAIL)" $out/run.log | tail -1)
          fifo_empty=$(grep -oE "fifo_empty = [0-9]+" $out/run.log | awk '{print $3}' | tail -1)
          syncs=$(grep -c "Sync changed" $out/run.log)
          zeroed=none; gps=none; gaps=none
          if [ -f $out/test.wav ]; then
            sox $out/test.wav -t raw -e signed -b 16 -c 1 -r 48000 $RUNNER_TEMP/capture.raw
            z=$(python3 ${{github.workspace}}/test/diag/zerofrac.py $RUNNER_TEMP/capture.raw "round $round")
            echo "$z"
            zeroed=$(echo "$z" | grep -oE "[0-9.]+% of" | awk '{print $1}')
            gps=$(echo "$z" | grep -oE "gaps per second [0-9.]+" | awk '{print $4}')
            gaps=$(echo "$z" | sed -E 's/.*\(samples:count\) ?//' | tr ',' ' ' | xargs)
          fi
          tail -5 $out/run.log
          echo "$round,${loss:-none},${result:-none},${zeroed},${gps},${gaps:-none},${fifo_empty:-none},${syncs}" | tee -a $RUNNER_TEMP/runs/results.csv
          echo "::endgroup::"
        done

    - name: Summarize
      shell: bash
      if: ${{ !cancelled() }}
      run: |
        {
          echo "### ${{ matrix.sanitizer }}, BlackHole latency ${{ matrix.blackhole_latency }}"
          echo
          echo '```'
          cat $RUNNER_TEMP/runs/results.csv
          echo '```'
        } | tee -a $GITHUB_STEP_SUMMARY

    - name: Stash results
      uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: rade-loss-diag-${{ matrix.sanitizer }}-latency${{ matrix.blackhole_latency }}
        path: ${{ runner.temp }}/runs
        retention-days: 7
